{% extends 'base.html' %}
{% block title %}Apply · {{ job.title }}{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="page-header"><div class="page-kicker">Application</div><h1 class="fw-bold">Apply for {{ job.title }}</h1><p class="text-muted">Submit your candidate information and CV in PDF format.</p></div><div class="page-card p-4"><form method="POST" enctype="multipart/form-data">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Full Name</label><input type="text" name="full_name" class="form-control" required></div><div class="col-md-6"><label class="form-label fw-semibold">Email</label><input type="email" name="email" class="form-control" required></div><div class="col-12"><label class="form-label fw-semibold">CV PDF</label><input type="file" name="cv_file" class="form-control" accept=".pdf,application/pdf" required><div class="form-text">Please upload a PDF CV.</div></div></div><button class="btn btn-tl mt-4">Submit Application</button></form></div></div></div>{% endblock %}
