<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Something Went Wrong · AI Civil Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--tl-red:#c8102e;--tl-yellow:#ffcd00;--ink:#1c1c1e;--muted:#6b7280;--surface:#f7f7f9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--surface);color:var(--ink)}
.card{max-width:480px;margin:24px;text-align:center;background:#fff;border-radius:16px;
  box-shadow:0 4px 18px rgba(16,24,40,.08);padding:48px 36px}
.stripe{height:6px;width:64px;margin:0 auto 24px;border-radius:999px;
  background:linear-gradient(90deg,var(--tl-red),var(--tl-yellow))}
.code{font-size:3rem;font-weight:800;color:var(--tl-red);margin:0}
h1{font-size:1.25rem;font-weight:700;margin:8px 0 12px}
p{color:var(--muted);margin:0 0 24px;line-height:1.6}
a.btn{display:inline-block;background:var(--tl-red);color:#fff;text-decoration:none;
  padding:.65rem 1.5rem;border-radius:10px;font-weight:600}
a.btn:hover{background:#a90d26}
</style>
</head>
<body>
<div class="card">
  <div class="stripe"></div>
  <p class="code">500</p>
  <h1>Something went wrong on our end</h1>
  <p>The AI service may be temporarily unavailable. Please try again in a
     moment, or head back and try a different action.</p>
  <a class="btn" href="/">Back to Home</a>
</div>
</body>
</html>
