<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Decision fusion pipeline</title>
<desc>Three parallel scoring stages - rule engine, skill gap analysis, and semantic matching - feed into a weighted decision fusion formula, which produces the final score and recommendation.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>

<rect x="40" y="40" width="170" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="125" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#501313">Rule engine</text>
<text x="125" y="78" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#791F1F">Skills hard gate</text>

<rect x="250" y="40" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="335" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Skill gap score</text>
<text x="335" y="78" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">40% weight</text>

<rect x="460" y="40" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="545" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">Semantic match</text>
<text x="545" y="78" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">LLM, 40% weight</text>

<path d="M125 96 L125 130 L340 130 L340 160" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="335" y1="96" x2="340" y2="160" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M545 96 L545 130 L340 130 L340 160" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="190" y="160" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="180" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Decision fusion formula</text>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Weighted sum, capped on gate failure</text>

<line x1="340" y1="216" x2="340" y2="280" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="190" y="280" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#412402">Final score and decision</text>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#633806">0-100, reviewed by a human recruiter</text>
</svg>
