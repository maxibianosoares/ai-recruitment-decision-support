<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>System architecture</title>
<desc>A single Django application containing two subsystems, the RAG policy assistant and the recruitment matching pipeline, both calling a local Ollama LLM. The RAG subsystem also reads a FAISS knowledge base, while the recruitment subsystem persists to a SQLite database.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>

<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Ollama LLM (gemma3:12b)</text>
<line x1="340" y1="60" x2="340" y2="108" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="90" y="110" width="500" height="200" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="135" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Django web application</text>

<rect x="120" y="160" width="220" height="130" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="230" y="190" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">RAG policy assistant</text>
<text x="230" y="210" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Retrieve + verify claims</text>

<rect x="360" y="160" width="210" height="130" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="465" y="190" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Recruitment pipeline</text>
<text x="465" y="210" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">Rule + skill + semantic</text>

<text x="230" y="345" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">FAISS knowledge base</text>
<line x1="230" y1="335" x2="230" y2="292" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<text x="465" y="345" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">SQLite database</text>
<line x1="465" y1="335" x2="465" y2="292" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
</svg>
