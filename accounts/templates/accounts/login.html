{% extends 'base.html' %}
{% block title %}Login · AI Civil Service{% endblock %}
{% block content %}<div class="row justify-content-center py-5"><div class="col-md-5 col-lg-4"><div class="text-center mb-4"><div class="navbar-brand-mark mx-auto mb-3"></div><h1 class="h3 fw-bold">AI Civil Service</h1><p class="text-muted">Timor-Leste Recruitment Platform</p></div><div class="page-card p-4"><h2 class="h5 fw-bold mb-4">Sign in</h2><form method="POST">{% csrf_token %}<div class="mb-3"><label class="form-label fw-semibold">Username</label><input type="text" name="username" class="form-control" required autocomplete="username"></div><div class="mb-4"><label class="form-label fw-semibold">Password</label><input type="password" name="password" class="form-control" required autocomplete="current-password"></div><button class="btn btn-tl w-100">Login</button></form></div></div></div>{% endblock %}
